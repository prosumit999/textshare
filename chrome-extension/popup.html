<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text Share – Quick Text Sharing</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <a class="brand" id="home-link" href="#" aria-label="Open Text Share">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            ></path>
            <path d="M14 2v6h6M9 13h6M9 17h6"></path>
          </svg>
          <span>Text <strong>Share</strong></span>
        </a>
      </header>

      <section class="intro">
        <span class="eyebrow">Quick share</span>
        <h1>Share without breaking your flow.</h1>
        <p>Paste a note here, or select text on any page and right-click.</p>
      </section>

      <form id="share-form">
        <label for="share-text">Text or code</label>
        <textarea
          id="share-text"
          rows="6"
          maxlength="50000"
          placeholder="Paste something worth sharing…"
          required
        ></textarea>
        <div class="field-meta">
          <span>Private by default</span
          ><span id="character-count">0 / 50,000</span>
        </div>
        <button class="primary-button" type="submit">
          <span>Continue in Text Share</span><span aria-hidden="true">→</span>
        </button>
      </form>

      <section class="context-tip" aria-label="Context menu instructions">
        <span class="mouse-icon" aria-hidden="true"
          ><svg viewBox="0 0 24 24">
            <rect x="7" y="2" width="10" height="20" rx="5"></rect>
            <path d="M12 2v6"></path></svg
        ></span>
        <p>
          <strong>From any webpage</strong
          ><span>Select text → right-click → Share with Text Share</span>
        </p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
